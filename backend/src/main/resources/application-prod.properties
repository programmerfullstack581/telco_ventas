# ============================================================
# Perfil PRODUCCION (Railway / cualquier host con Docker)
# Todas las credenciales llegan por variables de entorno:
#
#   DB_URL          -> jdbc:mysql://host:3306/basedatos?...
#   DB_USER         -> usuario de la BD
#   DB_PASSWORD     -> contrasena de la BD
#   JWT_SECRET      -> clave para firmar tokens (obligatoria)
#   CORS_ORIGINS    -> URLs del frontend separadas por coma
#   PORT            -> puerto HTTP (Railway lo inyecta solo)
# ============================================================

server.port=${PORT:8080}
spring.application.name=ventas-telco

# --- Base de datos MySQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=30000

# --- JPA: Hibernate crea/actualiza tablas sin borrar datos ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No ejecutar scripts SQL al arrancar (DataInitializer siembra los datos)
spring.sql.init.mode=never

# --- Seguridad ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (dominios del frontend en produccion) ---
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Swagger disponible en produccion (/swagger-ui.html) ---
springdoc.swagger-ui.path=/swagger-ui.html
