# ============================================================
# Perfil PRODUCCION (Railway / cualquier host con Docker)
# Todas las credenciales llegan por variables de entorno:
#
#   DB_URL          -> jdbc:postgresql://host:5432/basedatos?sslmode=require
#   DB_USER         -> usuario de la BD (postgres.XXXX en Supabase Pooler)
#   DB_PASSWORD     -> contrasena de la BD
#   JWT_SECRET      -> clave para firmar tokens (obligatoria)
#   CORS_ORIGINS    -> URLs del frontend separadas por coma
#   PORT            -> puerto HTTP (Railway lo inyecta solo)
# ============================================================

server.port=${PORT:8080}
spring.application.name=ventas-telco

# --- Base de datos (MySQL por defecto con fallbacks seguros) ---
spring.datasource.url=${DB_URL:jdbc:h2:mem:telco;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# --- JPA: Hibernate crea/actualiza tablas sin borrar datos ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No ejecutar scripts SQL al arrancar (DataInitializer siembra los datos)
spring.sql.init.mode=never

# --- Seguridad ---
jwt.secret=${JWT_SECRET:TU_CLAVE_SECRETA_MUY_LARGA_Y_SEGURA_PARA_FIRMAR_JWT_TOKENS_2024_TELCO_VENTAS_1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS (dominios del frontend en produccion) ---
cors.allowed-origins=${CORS_ORIGINS:https://telco-ventas.vercel.app,http://localhost:5173,*}

# --- Swagger disponible en produccion (/swagger-ui.html) ---
springdoc.swagger-ui.path=/swagger-ui.html
