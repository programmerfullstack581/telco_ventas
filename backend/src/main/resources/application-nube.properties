server.port=${PORT:8081}

spring.application.name=ventas-telco

# Credenciales externas: se resuelven desde variables de entorno
# (AIVEN_DB_URL, AIVEN_DB_USER, AIVEN_DB_PASSWORD) o desde el archivo
# local application-nube-secret.properties (ignorado por git).
spring.config.import=optional:classpath:application-nube-secret.properties

# MySQL en la nube (Aiven, requiere SSL)
spring.datasource.url=${AIVEN_DB_URL}
spring.datasource.username=${AIVEN_DB_USER}
spring.datasource.password=${AIVEN_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA - Hibernate crea/actualiza tablas sin DROP destructivo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# No ejecutar scripts SQL (evita DROP/duplicados en cada arranque)
spring.sql.init.mode=never

# JWT
jwt.secret=TU_CLAVE_SECRETA_MUY_LARGA_Y_SEGURA_PARA_FIRMAR_JWT_TOKENS_2024_TELCO_VENTAS_1234567890
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,*}
