server.port=8080

spring.application.name=ventas-telco

# PostgreSQL (para producción o pruebas con BD persistente)
spring.datasource.url=jdbc:postgresql://localhost:5432/telco_ventas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql
spring.sql.init.data-locations=classpath:data-postgres.sql

# JWT
jwt.secret=TU_CLAVE_SECRETA_MUY_LARGA_Y_SEGURA_PARA_FIRMAR_JWT_TOKENS_2024_TELCO_VENTAS_1234567890
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:5173
