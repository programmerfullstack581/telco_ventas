server.port=${PORT:8081}

spring.application.name=ventas-telco

# H2 Database (por defecto para desarrollo rápido)
spring.datasource.url=jdbc:h2:mem:telco;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# JWT
jwt.secret=TU_CLAVE_SECRETA_MUY_LARGA_Y_SEGURA_PARA_FIRMAR_JWT_TOKENS_2024_TELCO_VENTAS_1234567890
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:5173
